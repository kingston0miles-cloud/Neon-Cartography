<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>НЕОН-КАРТОГРАФ · генератор городов</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Russo+One&family=Share+Tech+Mono&display=swap');
:root{
  --bg:#07080d; --panel:#0d0f18; --panel2:#12141f; --line:#242838; --line2:#31364a;
  --ink:#eef0fb; --ink-dim:#9aa0bd; --ink-mute:#6b7191;
  --acc:#ff3d8b; --acc2:#35e8d8; --acc3:#ffb02e;
  --radius:12px; --radius-sm:8px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 "Exo 2",system-ui,sans-serif;
  overflow:hidden; -webkit-font-smoothing:antialiased;
  padding-top:var(--safe-t); padding-bottom:var(--safe-b);
}
.app{ display:grid; grid-template-rows:auto 1fr; height:100%; }

/* ---- шапка ---- */
.topbar{
  display:flex; align-items:center; gap:10px; padding:9px 14px; background:linear-gradient(180deg,var(--panel),var(--panel) 90%,transparent);
  border-bottom:1px solid var(--line); z-index:20; flex-wrap:wrap;
}
.brand{ display:flex; align-items:center; gap:8px; font-family:"Russo One",sans-serif; font-size:15px; letter-spacing:.04em; color:var(--acc2); white-space:nowrap; text-shadow:0 0 14px rgba(53,232,216,.5); }
.brand svg{ flex:none; filter:drop-shadow(0 0 6px rgba(255,61,139,.6)); }
#cityName{
  background:var(--panel2); border:1px solid var(--line2); color:var(--ink); font:600 15px "Exo 2",sans-serif;
  padding:7px 12px; border-radius:var(--radius-sm); width:200px; min-width:120px;
}
#cityName:focus{ outline:2px solid var(--acc2); outline-offset:0; }
.spacer{ flex:1 1 auto; }
.iconbtn{
  display:flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:var(--radius-sm);
  background:var(--panel2); border:1px solid var(--line2); color:var(--ink-dim); cursor:pointer; transition:.15s;
}
.iconbtn:hover{ color:var(--ink); border-color:var(--acc2); }
.iconbtn:disabled{ opacity:.35; cursor:default; }
.iconbtn:disabled:hover{ border-color:var(--line2); }

/* ---- основная сетка ---- */
.main{ display:grid; grid-template-columns:64px 1fr 340px; min-height:0; }
@media (max-width:900px){ .main{ grid-template-columns:56px 1fr; } .panel{ position:fixed; inset:auto 0 0 0; top:auto; height:66vh; width:100%; border-left:none; border-top:1px solid var(--line); border-radius:16px 16px 0 0; transform:translateY(100%); transition:transform .25s ease; z-index:40; } .panel.open{ transform:translateY(0); } .panelToggle{ display:flex !important; } }

/* ---- инструменты слева ---- */
.tools{ display:flex; flex-direction:column; gap:4px; padding:10px 6px; background:var(--panel); border-right:1px solid var(--line); overflow-y:auto; align-items:center; }
.tool{
  display:flex; flex-direction:column; align-items:center; gap:2px; width:52px; padding:7px 2px 6px; border-radius:10px;
  background:transparent; border:1px solid transparent; color:var(--ink-mute); cursor:pointer; transition:.15s;
}
.tool .ti{ display:flex; }
.tool .tl{ font-size:9.5px; letter-spacing:.01em; line-height:1.1; }
.tool:hover{ background:var(--panel2); color:var(--ink-dim); }
.tool.on{ background:rgba(255,61,139,.14); border-color:var(--acc); color:var(--acc); }
.tool.on .ti svg{ filter:drop-shadow(0 0 5px rgba(255,61,139,.7)); }

/* ---- холст ---- */
.stage{ position:relative; overflow:hidden; background:#000; touch-action:none; }
#cv{ display:block; touch-action:none; }
#hud{ position:absolute; left:10px; bottom:10px; padding:4px 10px; background:rgba(6,7,12,.72); border:1px solid var(--line2); border-radius:20px; font:600 11px "Share Tech Mono",monospace; color:var(--acc2); pointer-events:none; backdrop-filter:blur(3px); }
#toast{ position:absolute; left:50%; top:14px; transform:translate(-50%,-14px); padding:9px 16px; background:rgba(10,11,18,.92); border:1px solid var(--line2); border-radius:10px; font-size:12.5px; color:var(--ink); opacity:0; transition:.25s; pointer-events:none; max-width:min(420px,80vw); text-align:center; z-index:30; }
#toast.on{ opacity:1; transform:translate(-50%,0); }
#busy{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px; background:rgba(4,5,9,.72); backdrop-filter:blur(2px); z-index:35; font:600 13px "Exo 2"; color:var(--acc2); }
#busy[hidden]{ display:none; }
#busy .spin{ width:30px; height:30px; border-radius:50%; border:3px solid rgba(53,232,216,.25); border-top-color:var(--acc2); animation:sp .8s linear infinite; }
@keyframes sp{ to{ transform:rotate(360deg); } }
.panelToggle{ display:none; position:absolute; right:10px; bottom:10px; z-index:30; }

/* ---- нижняя панель рисования ---- */
.drawbar{ position:absolute; left:50%; bottom:16px; transform:translateX(-50%); display:flex; align-items:center; gap:8px; padding:8px 10px; background:rgba(10,11,18,.92); border:1px solid var(--line2); border-radius:12px; z-index:25; box-shadow:0 8px 30px rgba(0,0,0,.4); }
.drawbar[hidden]{ display:none; }
.drawbar span{ font-size:12px; color:var(--ink-dim); white-space:nowrap; padding:0 4px; }

/* ---- правая панель ---- */
.panel{ display:flex; flex-direction:column; background:var(--panel); border-left:1px solid var(--line); min-height:0; }
.tabsWrap{ position:relative; }
.tabs{ display:flex; gap:2px; padding:8px 8px 0; overflow-x:auto; scrollbar-width:none; scroll-behavior:smooth; }
.tabs::-webkit-scrollbar{ display:none; }
.tabsWrap::before,.tabsWrap::after{ content:''; position:absolute; top:0; bottom:0; width:36px; pointer-events:none; z-index:2; opacity:0; transition:opacity .18s ease; }
.tabsWrap::before{ left:0; background:linear-gradient(90deg,var(--panel) 35%,rgba(13,15,24,0)); }
.tabsWrap::after{ right:0; background:linear-gradient(270deg,var(--panel) 35%,rgba(13,15,24,0)); }
.tabsWrap.canLeft::before,.tabsWrap.canRight::after{ opacity:1; }
.tabsWrap .arr{ position:absolute; top:50%; transform:translateY(-50%); width:18px; height:18px; line-height:16px; text-align:center; color:var(--acc2); font:800 18px "Exo 2",sans-serif; pointer-events:none; z-index:3; opacity:0; transition:opacity .18s ease; text-shadow:0 0 6px rgba(53,232,216,.7); }
.tabsWrap.canLeft .arrL{ left:1px; opacity:.9; }
.tabsWrap.canRight .arrR{ right:1px; opacity:.9; }.tab{ flex:none; padding:8px 11px; font:600 12px "Exo 2"; color:var(--ink-mute); background:transparent; border:none; border-bottom:2px solid transparent; cursor:pointer; white-space:nowrap; }
.tab:hover{ color:var(--ink-dim); }
.tab.on{ color:var(--acc2); border-color:var(--acc2); }
#pbody{ flex:1; overflow-y:auto; padding:12px 14px 90px; }
.sec{ margin-bottom:18px; padding-bottom:16px; border-bottom:1px solid var(--line); }
.sec:last-child{ border-bottom:none; }
.sec h3{ margin:0 0 10px; font:700 11px "Exo 2"; letter-spacing:.08em; text-transform:uppercase; color:var(--acc2); opacity:.85; }
.fld{ display:block; margin-bottom:12px; }
.fl{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink-dim); margin-bottom:5px; }
.fl output{ color:var(--ink); font:600 12px "Share Tech Mono",monospace; }
input[type=range]{ width:100%; accent-color:var(--acc2); height:18px; }
input[type=text],input[type=number],select{
  width:100%; background:var(--panel2); border:1px solid var(--line2); color:var(--ink); font:500 13px "Exo 2"; padding:8px 10px; border-radius:var(--radius-sm);
}
input[type=text]:focus,input[type=number]:focus,select:focus{ outline:2px solid var(--acc2); outline-offset:0; }
.chk{ display:flex; align-items:center; gap:9px; margin-bottom:10px; font-size:13px; color:var(--ink-dim); cursor:pointer; }
.chk input{ width:16px; height:16px; accent-color:var(--acc); }
.clr{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink-dim); margin-bottom:9px; }
.clr input[type=color]{ width:30px; height:30px; padding:0; border:1px solid var(--line2); border-radius:7px; background:none; cursor:pointer; flex:none; }
.clr span{ flex:1; }
.cgrid{ display:grid; grid-template-columns:1fr 1fr; gap:2px 12px; }
.pgrid{ display:flex; flex-direction:column; gap:6px; }
.pbtn{ display:flex; align-items:center; gap:10px; padding:7px 9px; background:var(--panel2); border:1px solid var(--line2); border-radius:9px; color:var(--ink-dim); font:600 12.5px "Exo 2"; cursor:pointer; text-align:left; }
.pbtn:hover{ border-color:var(--acc2); color:var(--ink); }
.sws{ display:flex; flex:none; width:52px; height:20px; border-radius:5px; overflow:hidden; border:1px solid rgba(255,255,255,.15); }
.sws i{ flex:1; }
.seg{ display:flex; gap:4px; margin-bottom:12px; background:var(--panel2); padding:4px; border-radius:10px; }
.segb{ flex:1; padding:8px 4px; background:transparent; border:none; border-radius:7px; color:var(--ink-mute); font:600 12px "Exo 2"; cursor:pointer; }
.segb.on{ background:var(--acc); color:#fff; box-shadow:0 0 12px rgba(255,61,139,.5); }
.row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
.row.tight{ gap:6px; align-items:center; }
.row.tight input{ flex:1; }
.btn{ padding:9px 14px; background:var(--panel2); border:1px solid var(--line2); color:var(--ink); font:600 12.5px "Exo 2"; border-radius:var(--radius-sm); cursor:pointer; transition:.15s; }
.btn:hover{ border-color:var(--acc2); color:var(--acc2); }
.btn.sm{ padding:5px 10px; font-size:11.5px; }
.btn.wide{ width:100%; }
.btn.primary{ background:linear-gradient(135deg,var(--acc),#c92a6e); border-color:transparent; color:#fff; box-shadow:0 4px 18px rgba(255,61,139,.35); }
.btn.primary:hover{ filter:brightness(1.1); color:#fff; }
.btn.danger{ border-color:#5a2233; color:#ff7a9a; }
.btn.danger:hover{ border-color:#ff5580; background:rgba(255,61,139,.08); }
.btn.ghost{ background:transparent; border-color:transparent; color:var(--ink-mute); }
.btn.off{ opacity:.45; }
.hint{ font-size:11.5px; color:var(--ink-mute); line-height:1.5; margin:2px 0 0; }
.list{ display:flex; flex-direction:column; gap:3px; max-height:220px; overflow-y:auto; }
.li{ display:flex; align-items:center; gap:8px; padding:7px 9px; background:var(--panel2); border:1px solid transparent; border-radius:7px; color:var(--ink-dim); font:500 12px "Exo 2"; cursor:pointer; text-align:left; }
.li:hover{ color:var(--ink); } .li.on{ border-color:var(--acc2); color:var(--acc2); background:rgba(53,232,216,.08); }
.chip{ width:11px; height:11px; border-radius:3px; flex:none; }
.chead{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.chead strong{ font-size:13.5px; color:var(--ink); }
#card{ flex:none; max-height:52vh; overflow-y:auto; padding:14px; border-top:1px solid var(--line2); background:var(--panel2); }
::-webkit-scrollbar{ width:9px; height:9px; }
::-webkit-scrollbar-thumb{ background:var(--line2); border-radius:6px; }
::-webkit-scrollbar-track{ background:transparent; }
@media (max-width:640px){
  .brand .bt{ display:none; } #cityName{ width:120px; }
  .main{ grid-template-columns:52px 1fr; }
  .tool{ width:42px; } .tool .tl{ display:none; }
}

</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24"><path d="M3 12l9-8 9 8M6 11v9h12v-9" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/><path d="M10 20v-5h4v5" stroke="currentColor" stroke-width="2" fill="none"/></svg>
      <span class="bt">НЕОН-КАРТОГРАФ</span>
    </div>
    <input id="cityName" type="text" value="" placeholder="Название города" aria-label="Название города" spellcheck="false">
    <button class="iconbtn" id="bGen" title="Новый случайный город" aria-label="Новый случайный город">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>

      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
    </button>
    <button class="iconbtn" id="bUndo" title="Отменить (Ctrl+Z)" aria-label="Отменить" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
    </button>
    <button class="iconbtn" id="bRedo" title="Повторить (Ctrl+Shift+Z)" aria-label="Повторить" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
    </button>
    <div class="spacer"></div>
  </header>
  <div class="main">
    <nav class="tools" id="tools" aria-label="Инструменты"></nav>
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div id="hud">100%</div>
      <div id="toast"></div>
      <div class="drawbar" id="drawbar" hidden>
        <span id="dbInfo"></span>
        <button class="btn sm" id="dbUndo">Назад</button>
        <button class="btn sm primary" id="dbDone">Готово (Enter)</button>
        <button class="btn sm ghost" id="dbCancel">Отмена (Esc)</button>
      </div>
      <button class="iconbtn panelToggle" id="bPanelToggle" title="Панель" aria-label="Открыть панель" onclick="document.querySelector('.panel').classList.toggle('open')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div id="busy" hidden><div class="spin"></div><div id="busyMsg">Генерация…</div></div>
    </div>
    <aside class="panel">
      <div class="tabsWrap" id="tabsWrap">
        <div class="tabs" id="tabs" role="tablist"></div>
        <span class="arr arrL" aria-hidden="true">‹</span>
        <span class="arr arrR" aria-hidden="true">›</span>
      </div>
      <div id="pbody"></div>
      <div id="card" hidden></div>
    </aside>
  </div>
</div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<script>
'use strict';
/* =====================================================================
   ДВИЖОК: утилиты, геометрия, шум, генерация мира
   ===================================================================== */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rrange = (r, a, b) => a + (b - a) * r();
const rint = (r, a, b) => Math.floor(a + (b - a + 1) * r());
const pick = (r, arr) => arr[Math.floor(r() * arr.length)];
const clone = o => JSON.parse(JSON.stringify(o));
function shuffle(r, a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function hex2rgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgb2hex(r, g, b) { return '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join(''); }
function luminance(h) { const [r, g, b] = hex2rgb(h); return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255; }
function mixHex(a, b, t) { const A = hex2rgb(a), B = hex2rgb(b); return rgb2hex(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t)); }

function makeNoise(seed) {
  const r = mulberry32(seed >>> 0), g = new Float32Array(65536);
  for (let i = 0; i < 65536; i++) g[i] = r();
  function v2(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y); let fx = x - xi, fy = y - yi;
    fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
    const x0 = xi & 255, y0 = yi & 255, x1 = (xi + 1) & 255, y1 = (yi + 1) & 255;
    const a = g[y0 * 256 + x0], b = g[y0 * 256 + x1], c = g[y1 * 256 + x0], d = g[y1 * 256 + x1];

/* ---------- геометрия ---------- */
function pip(x, y, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;

}
function bboxOf(poly) { let a = 1e9, b = 1e9, c = -1e9, d = -1e9; for (const p of poly) { if (p[0] < a) a = p[0]; if (p[0] > c) c = p[0]; if (p[1] < b) b = p[1]; if (p[1] > d) d = p[1]; } return [a, b, c, d]; }
function polyArea(p) { let s = 0; for (let i = 0, j = p.length - 1; i < p.length; j = i++) s += p[j][0] * p[i][1] - p[i][0] * p[j][1]; return s / 2; }
function ensureCCW(p) { if (polyArea(p) < 0) p.reverse(); return p; }
function polyCentroid(p) {
  let a = 0, cx = 0, cy = 0;
  for (let i = 0, j = p.length - 1; i < p.length; j = i++) { const f = p[j][0] * p[i][1] - p[i][0] * p[j][1]; a += f; cx += (p[j][0] + p[i][0]) * f; cy += (p[j][1] + p[i][1]) * f; }
  if (Math.abs(a) < 1e-6) { let sx = 0, sy = 0; for (const q of p) { sx += q[0]; sy += q[1]; } return [sx / p.length, sy / p.length]; }

function distSeg(px, py, ax, ay, bx, by) { const dx = bx - ax, dy = by - ay; const L = dx * dx + dy * dy; let t = L ? ((px - ax) * dx + (py - ay) * dy) / L : 0; t = t < 0 ? 0 : t > 1 ? 1 : t; const x = ax + t * dx - px, y = ay + t * dy - py; return Math.sqrt(x * x + y * y); }
function distPoly(x, y, poly) { let m = 1e18; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const d = distSeg(x, y, poly[j][0], poly[j][1], poly[i][0], poly[i][1]); if (d < m) m = d; } return m; }
function clipHalf(poly, nx, ny, c) {
  const out = [], n = poly.length;
  for (let i = 0; i < n; i++) {
    const a = poly[i], b = poly[(i + 1) % n];
    const da = nx * a[0] + ny * a[1] - c, db = nx * b[0] + ny * b[1] - c;
    if (da <= 0) out.push(a);
    if ((da < 0 && db > 0) || (da > 0 && db < 0)) { const t = da / (da - db); out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]); }

  if (pts.length < 2) return pts.map(p => p.slice());
  const out = [], P = i => pts[clamp(i, 0, pts.length - 1)];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
    const L = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]); const n = Math.max(1, Math.ceil(L / step));
    for (let k = 0; k < n; k++) {

/* ---------- контекст района для имён ---------- */
/* ---------- контекст для произвольной точки карты ---------- */
function contextForPoint(S, x, y) {
  const ctx = {};
  // terrain
  let waterNear = 0, mountainNear = 0, riverNear = 0;
  for (let k = 0; k < 12; k++) {
    const a = k / 12 * TAU;
    const px = x + Math.cos(a) * 180, py = y + Math.sin(a) * 180;
    if (S.waterAt(px, py) > 0.5) waterNear++;
    if (S.heightAt(px, py) > 0.55) mountainNear++;
  }
  for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
    if (S.inRiver(x + dx * 40, y + dy * 40)) riverNear++;
  }
  const terrainM = [], terrainF = [];
  if (S.seaSide && waterNear >= 3) { terrainM.push('Морской'); terrainF.push('Морская'); }
  if (S.lake && waterNear >= 3) { terrainM.push('Озёрный'); terrainF.push('Озёрная'); }
  if (riverNear >= 2) { terrainM.push('Речной'); terrainF.push('Речная'); }
  if (mountainNear >= 3) { terrainM.push('Горный'); terrainF.push('Горная'); }
  if (waterNear >= 3 && !S.seaSide && !S.lake) { terrainM.push('Прибрежный'); terrainF.push('Прибрежная'); }
  if (!terrainM.length) { terrainM.push('Полевой'); terrainF.push('Полевая'); }
  const ti = Math.floor(S.noise.v2(x * 0.001, y * 0.001) * terrainM.length) % terrainM.length;
  ctx.terrain_m = terrainM[ti];
  ctx.terrain_f = terrainF[ti];

  // ближайший (или содержащий) район
  let district = null;
  for (const d of S.districts) {
    const bb = d._bb || (d._bb = bboxOf(d.poly));
    if (x < bb[0] || x > bb[2] || y < bb[1] || y > bb[3]) continue;
    if (pip(x, y, d.poly)) { district = d; break; }
  }
  if (district) {
    Object.assign(ctx, districtContext(district, S));
  } else {
    ctx.rank_m = 'Дальний'; ctx.rank_f = 'Дальняя';
    ctx.age_m = 'Новый'; ctx.age_f = 'Новая';
    ctx.industry_m = 'Ремесленный'; ctx.industry_f = 'Ремесленная';
    const dx = x - S.center[0], dy = y - S.center[1];
    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx > 0) { ctx.side_m = 'Восточный'; ctx.side_f = 'Восточная'; }
      else { ctx.side_m = 'Западный'; ctx.side_f = 'Западная'; }
    } else {
      if (dy > 0) { ctx.side_m = 'Южный'; ctx.side_f = 'Южная'; }
      else { ctx.side_m = 'Северный'; ctx.side_f = 'Северная'; }
    }
  }
  return ctx;
}

/* ---------- контекст района для имён ---------- */
function districtContext(d, S) {
  const c = polyCentroid(d.poly);
  const ctx = {};

  // --- terrain: рельеф окружения ---
  let waterNear = 0, mountainNear = 0, riverNear = 0;
  for (let k = 0; k < 12; k++) {
    const a = k / 12 * TAU;
    const x = c[0] + Math.cos(a) * 180, y = c[1] + Math.sin(a) * 180;
    if (S.waterAt(x, y) > 0.5) waterNear++;
    if (S.heightAt(x, y) > 0.55) mountainNear++;
  }
  for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
    if (S.inRiver(c[0] + dx * 40, c[1] + dy * 40)) riverNear++;
  }
  const terrainM = [], terrainF = [];
  if (S.seaSide && waterNear >= 3) { terrainM.push('Морской'); terrainF.push('Морская'); }
  if (S.lake && waterNear >= 3) { terrainM.push('Озёрный'); terrainF.push('Озёрная'); }
  if (riverNear >= 2) { terrainM.push('Речной'); terrainF.push('Речная'); }
  if (mountainNear >= 3) { terrainM.push('Горный'); terrainF.push('Горная'); }
  if (waterNear >= 3 && !S.seaSide && !S.lake) { terrainM.push('Прибрежный'); terrainF.push('Прибрежная'); }
  if (!terrainM.length) { terrainM.push('Полевой'); terrainF.push('Полевая'); }
  const ti = Math.floor(S.noise.v2(c[0] * 0.001, c[1] * 0.001) * terrainM.length) % terrainM.length;
  ctx.terrain_m = terrainM[ti];
  ctx.terrain_f = terrainF[ti];

  // --- rank: расстояние от центра ---
  let rho = 1;
  if (S.clusters && S.clusters.length) {
    rho = 1e9;
    for (const cl of S.clusters) {
      const dd = Math.hypot((c[0] - cl.x) / cl.rx, (c[1] - cl.y) / cl.ry);
      if (dd < rho) rho = dd;
    }
  } else if (S.ell) {
    rho = Math.hypot((c[0] - S.center[0]) / S.ell.rx, (c[1] - S.center[1]) / S.ell.ry);
  }
  if (rho < 0.35) { ctx.rank_m = 'Центральный'; ctx.rank_f = 'Центральная'; }
  else if (rho < 0.72) { ctx.rank_m = 'Средний'; ctx.rank_f = 'Средняя'; }
  else { ctx.rank_m = 'Дальний'; ctx.rank_f = 'Дальняя'; }

  // --- age: древний/старый/новый ---
  const density = d.density || 0.5;
  if (rho < 0.35 && density > 0.7) { ctx.age_m = 'Древний'; ctx.age_f = 'Древняя'; }
  else if (density > 0.55) { ctx.age_m = 'Старый'; ctx.age_f = 'Старая'; }
  else if (density < 0.35 || rho > 0.85) { ctx.age_m = 'Новый'; ctx.age_f = 'Новая'; }
  else { ctx.age_m = 'Средний'; ctx.age_f = 'Средняя'; }

  // --- industry: ближайший промышленный сосед ---
  const IND_M = {
    industrial: ['Кузнечный', 'Литейный', 'Кожевенный', 'Гончарный', 'Мыловаренный', 'Столярный', 'Плотницкий', 'Ткацкий'],
    harbor:     ['Рыбацкий', 'Портовый', 'Корабельный'],
    tech:       ['Квантовый', 'Электронный', 'Научный', 'Реакторный']
  };
  const IND_F = {
    industrial: ['Кузнечная', 'Литейная', 'Кожевенная', 'Гончарная', 'Мыловаренная', 'Столярная', 'Плотницкая', 'Ткацкая'],
    harbor:     ['Рыбацкая', 'Портовая', 'Корабельная'],
    tech:       ['Квантовая', 'Электронная', 'Научная', 'Реакторная']
  };
  let bestD = 1e9, bestType = null;
  for (const other of S.districts) {
    if (other.id === d.id) continue;
    const ot = other.type;
    if (!(ot === 'industrial' || ot === 'harbor' || ot === 'tech')) continue;
    const oc = polyCentroid(other.poly);
    const dd = Math.hypot(c[0] - oc[0], c[1] - oc[1]);
    if (dd < bestD) { bestD = dd; bestType = ot; }
  }
  if (bestType && bestD < 600) {
    const iM = IND_M[bestType] || [], iF = IND_F[bestType] || [];
    const h = ((S.seed >>> 0) ^ (d.id * 2654435761)) >>> 0;
    const idx = h % Math.max(1, iM.length);
    ctx.industry_m = iM[idx] || 'Ремесленный';
    ctx.industry_f = iF[idx] || 'Ремесленная';
  } else {
    ctx.industry_m = 'Ремесленный';
    ctx.industry_f = 'Ремесленная';
  }

  // --- side: сторона света относительно центра ---
  const dx = c[0] - S.center[0], dy = c[1] - S.center[1];
  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 0) { ctx.side_m = 'Восточный'; ctx.side_f = 'Восточная'; }
    else { ctx.side_m = 'Западный'; ctx.side_f = 'Западная'; }
  } else {
    if (dy > 0) { ctx.side_m = 'Южный'; ctx.side_f = 'Южная'; }
    else { ctx.side_m = 'Северный'; ctx.side_f = 'Северная'; }
  }

  return ctx;
}

/* ---------- парки и зелёные зоны ---------- */

function regenAllNames(S, rngSeed) {
  const rng = mulberry32((rngSeed || ((Date.now() ^ S.seed) >>> 0)) >>> 0);
  const used = new Set();
  for (const d of S.districts) { d.name = districtName(S, rng, d.type, used, d); computeLabel(d); }
  for (const r of S.rivers) {
    const mid = r.pts && r.pts.length ? r.pts[Math.floor(r.pts.length / 2)] : [S.center[0], S.center[1]];
    r.name = riverName(S, rng, contextForPoint(S, mid[0], mid[1]));
  }
  for (const r of S.roads) {
    if (r.kind === 'rail') r.name = 'Линия ' + rint(rng, 1, 99);
    else if (r.kind === 'highway') r.name = pick(rng, ['Магистраль', 'Трасса', 'Шоссе']) + ' ' + rint(rng, 1, 99);
    else if (r.kind === 'avenue') {
      const mid = r.pts && r.pts.length ? r.pts[Math.floor(r.pts.length / 2)] : [S.center[0], S.center[1]];
      r.name = streetName(S, rng, contextForPoint(S, mid[0], mid[1]));
    }
  }
  for (const l of S.labels) if (l.kind === 'street' && l.auto) {
    const p = l.path && l.path.length ? l.path[Math.floor(l.path.length / 2)] : null;
    const ctx = p ? contextForPoint(S, p[0], p[1]) : null;
    l.text = streetName(S, rng, ctx);
  }
  // 5. Объекты

    for (let i = 0; i < n; i++) {
      setBusy('Рендер PDF: полоса ' + (i + 1) + ' из ' + n + '…'); await tick();
      const y0 = i * stripH, hh = Math.min(stripH + (i < n - 1 ? 2 : 0), pl.Hpx - y0); c.width = pl.Wpx; c.height = hh;
      renderScene(x, S, { w: pl.Wpx, h: hh, s: pl.s, tx: 0, ty: -y0, pxk, gx: 0, gy: y0, gw: pl.Wpx, gh: pl.Hpx }, { plate: e.plate });
      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .93)); if (!blob) throw new Error('не хватило памяти — понизьте разрешение или формат');
      const jpeg = new Uint8Array(await blob.arrayBuffer());
      strips.push({ jpeg, w: pl.Wpx, h: hh, dw: pl.Wpx * ptPx, dh: hh * ptPx, x: leftPt, y: topPt - (y0 + hh) * ptPx });
    }
    setBusy('Сборка PDF…'); await tick();
    const pdf = buildPDF({ w: pl.pw * mmPt, h: pl.ph * mmPt }, hex2rgb(S.pal.bg), strips); setBusy(null); await saveBlob(fname() + '.pdf', pdf);
  } catch (er) { setBusy(null); console.error(er); toast('Ошибка PDF: ' + er.message); }
}

/* ---------- проект ---------- */
async function saveProject() { const blob = new Blob([JSON.stringify(toProject(app.S))], { type: 'application/json' }); await saveBlob(fname() + '.json', blob); }
function loadProjectText(txt) {
  try { const S = fromProject(JSON.parse(txt)); pushUndoRaw(); app.S = S; if (S.gen) Object.assign(app.gen, S.gen); app.sel = null; app.draft = null; updateDrawbar(); $('cityName').value = S.name; fit(); buildPanel(); render(); changed(); toast('Проект загружен'); }
  catch (e) { console.error(e); toast('Не удалось прочитать проект'); }
}
function pushUndoRaw() { if (app.S) { app.undo.push(snapshot(app.S)); app.redo.length = 0; syncUndo(); } }

/* ---------- запуск ---------- */
async function init() {
  buildTools(); $('bUndo').onclick = undo; $('bRedo').onclick = redo; $('bFit').onclick = () => { fit(); render(); };

  // Горизонтальная прокрутка вкладок колесом мыши и трекпадом
  const tabsEl = $('tabs');
  tabsEl.addEventListener('wheel', e => {
    const dx = e.deltaX || 0, dy = e.deltaY || 0;
    const use = Math.abs(dx) > Math.abs(dy) ? dx : dy;
    if (!use) return;
    const canL = tabsEl.scrollLeft > 0;
    const canR = tabsEl.scrollLeft + tabsEl.clientWidth < tabsEl.scrollWidth - 1;
    if ((use < 0 && !canL) || (use > 0 && !canR)) return; // некуда скроллить — не мешаем дефолту
    e.preventDefault();
    tabsEl.scrollLeft += use;
    updateTabsScroll();
  }, { passive: false });
  tabsEl.addEventListener('scroll', updateTabsScroll, { passive: true });
  window.addEventListener('resize', () => { updateTabsScroll(); const a = tabsEl.querySelector('.tab.on'); if (a) { const tL = tabsEl.scrollLeft, tR = tL + tabsEl.clientWidth; if (a.offsetLeft < tL || a.offsetLeft + a.offsetWidth > tR) a.scrollIntoView({ inline: 'nearest', block: 'nearest' }); } });
  $('bGen').onclick = () => { app.gen.seed = Math.floor(Math.random() * 1e9); doGenerate(); };
  $('dbDone').onclick = finishDraft; $('dbUndo').onclick = () => { if (app.draft) { app.draft.pts.pop(); updateDrawbar(); render(); } }; $('dbCancel').onclick = cancelDraft;
  $('cityName').addEventListener('input', e => { if (app.S) { app.S.name = e.target.value; changed(); } });
  $('fileIn').addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => loadProjectText(r.result); r.readAsText(f); e.target.value = ''; });
  new ResizeObserver(resize).observe($('stage')); resize();
  try { await Promise.race([Promise.all(['600 16px "Exo 2"', '700 16px "Exo 2"', '800 16px "Exo 2"', '16px "Russo One"', '16px "Share Tech Mono"'].map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 2500))]); } catch (e) { }
  let ok = false;
  try { const raw = localStorage.getItem('neon-city-autosave'); if (raw) { app.S = fromProject(JSON.parse(raw)); if (app.S.gen) Object.assign(app.gen, app.S.gen); if (!app.gen.cityShape) app.gen.cityShape = 'round'; $('cityName').value = app.S.name; fit(); buildPanel(); ok = true; } } catch (e) { app.S = null; }
  if (!ok) { app.S = null; await doGenerate(); }
  document.fonts.ready.then(() => render()); syncUndo(); render();
}
init();
})();

</script>
